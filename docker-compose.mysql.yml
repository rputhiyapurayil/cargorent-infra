# Only MySQL - use this while running the services from your IDE / mvn spring-boot:run.
services:
  mysql:
    image: mysql:8.0
    container_name: cargorent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Kolkata
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
